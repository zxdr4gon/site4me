<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume &middot; The Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<main class="shell">

  <section style="margin:38px 0 20px;">
    <div class="label">CATALOG NO. 003 &middot; RESUME</div>
    <h1>Resume</h1>
    <p style="color:var(--ink-dim);">Education, experience, and skills — one card each, filed as they happen.</p>
  </section>

  <section style="margin-bottom:26px;">
    <h2>Education</h2>
    <div id="eduMount"></div>
  </section>

  <section style="margin-bottom:26px;">
    <h2>Experience</h2>
    <div id="expMount"></div>
  </section>

  <section style="margin-bottom:26px;">
    <h2>Skills</h2>
    <div id="skillMount"></div>
  </section>

</main>

<script src="js/app.js"></script>
<script src="js/github-cms.js"></script>
<script src="js/list-editor.js"></script>
<script>
  renderShell("resume");

  renderListPage({
    mount: document.getElementById("eduMount"),
    dataPath: "data/resume-education.json",
    itemLabel: "entry",
    emptyText: "No education logged yet.",
    fields: [
      { key:"school", label:"School", type:"text", role:"title", required:true },
      { key:"years",  label:"Years",  type:"text", role:"meta" },
      { key:"details",label:"Details",type:"textarea", role:"body" },
    ]
  });

  renderListPage({
    mount: document.getElementById("expMount"),
    dataPath: "data/resume-experience.json",
    itemLabel: "entry",
    emptyText: "No experience logged yet.",
    fields: [
      { key:"role",   label:"Role",   type:"text", role:"title", required:true },
      { key:"org",    label:"Organization", type:"text", role:"meta" },
      { key:"years",  label:"Years",  type:"text", role:"meta" },
      { key:"details",label:"Details",type:"textarea", role:"body" },
    ]
  });

  renderListPage({
    mount: document.getElementById("skillMount"),
    dataPath: "data/resume-skills.json",
    itemLabel: "skill",
    emptyText: "No skills logged yet.",
    fields: [
      { key:"name",  label:"Skill", type:"text", role:"title", required:true },
      { key:"level", label:"Level (optional)", type:"text", role:"meta" },
    ]
  });
</script>
<footer class="site-foot">The Archive &middot; built by hand, hosted on GitHub Pages</footer>
</body>
</html>
