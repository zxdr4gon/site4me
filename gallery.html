<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery &middot; The Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<main class="shell">

  <section style="margin:38px 0 20px;">
    <div class="label">CATALOG NO. 012 &middot; GALLERY</div>
    <h1>Gallery</h1>
    <p style="color:var(--ink-dim);">A few images worth keeping around.</p>
  </section>

  <div id="mount"></div>
</main>

<script src="js/app.js"></script>
<script src="js/github-cms.js"></script>
<script src="js/list-editor.js"></script>
<script>
  renderShell("gallery");
  renderListPage({
    mount: document.getElementById("mount"),
    dataPath: "data/gallery.json",
    itemLabel: "image",
    emptyText: "Gallery is empty.",
    tabClass: "",
    fields: [{"key": "imageUrl", "label": "Image URL", "type": "url", "role": "image"}, {"key": "title", "label": "Title", "type": "text", "role": "title", "required": true}, {"key": "date", "label": "Date", "type": "text", "role": "meta"}, {"key": "notes", "label": "Caption", "type": "textarea", "role": "body"}]
  });
</script>
<footer class="site-foot">The Archive &middot; built by hand, hosted on GitHub Pages</footer>
</body>
</html>
