<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects &middot; The Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<main class="shell">

  <section style="margin:38px 0 20px;">
    <div class="label">CATALOG NO. 004 &middot; PROJECTS</div>
    <h1>Projects</h1>
    <p style="color:var(--ink-dim);">Things I've built.</p>
  </section>

  <div id="mount"></div>
</main>

<script src="js/app.js"></script>
<script src="js/github-cms.js"></script>
<script src="js/list-editor.js"></script>
<script>
  renderShell("projects");
  renderListPage({
    mount: document.getElementById("mount"),
    dataPath: "data/projects.json",
    itemLabel: "project",
    emptyText: "No projects logged yet.",
    tabClass: "",
    fields: [{"key": "title", "label": "Title", "type": "text", "role": "title", "required": true}, {"key": "date", "label": "Date", "type": "text", "role": "meta"}, {"key": "description", "label": "Description", "type": "textarea", "role": "body"}, {"key": "tags", "label": "Tags (comma separated)", "type": "text", "role": "tags"}, {"key": "url", "label": "Link", "type": "url", "role": "link"}]
  });
</script>
<footer class="site-foot">The Archive &middot; built by hand, hosted on GitHub Pages</footer>
</body>
</html>
